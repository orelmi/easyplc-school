# =================================
# EasyPLC School - Docker Compose
# =================================
# Usage:
#   Development: docker-compose up -d
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # =================================
  # PostgreSQL Database
  # =================================
  db:
    image: postgres:16-alpine
    container_name: easyplc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easyplc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easyplc_secret}
      POSTGRES_DB: ${POSTGRES_DB:-easyplc_school}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easyplc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =================================
  # Application
  # =================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easyplc-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-easyplc}:${POSTGRES_PASSWORD:-easyplc_secret}@db:5432/${POSTGRES_DB:-easyplc_school}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
